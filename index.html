<!doctype html>
<html lang="en" class="theme-brand dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon_io/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#24282d" />
    <title>Lelta — Household Cash Flow &amp; Ledger</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      // Also run the one-time forced switch to the signature theme (keep this
      // key + logic in sync with migrateThemeOnce/themeClass in src/lib/theme.ts).
      (function () {
        try {
          if (!localStorage.getItem('lelta-theme-migrated-brand')) {
            localStorage.setItem('lelta-theme', 'brand')
            localStorage.setItem('lelta-theme-migrated-brand', '1')
          }
          var t = localStorage.getItem('lelta-theme') || 'brand'
          document.documentElement.className =
            t === 'ocean'
              ? 'theme-ocean dark'
              : t === 'slate-light'
                ? ''
                : t === 'teal-dark'
                  ? 'theme-teal-dark dark'
                  : 'theme-brand dark'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
